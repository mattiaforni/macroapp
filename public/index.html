<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Macroapp</title>
  <meta name="description" content="App personale e di coppia: lista, spese, diario, task, manuale di casa.">
  <meta name="theme-color" content="#EEEDE8">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <script>
  /* Prima di disegnare: senza, aprendo di sera si vedrebbe un lampo chiaro
     prima che il tema venga applicato. */
  (function () {
    try {
      var t = localStorage.getItem("macroapp.tema");
      if (t !== "giorno" && t !== "notte") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "notte" : "giorno";
      }
      document.documentElement.setAttribute("data-tema", t);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "notte" ? "#1B1A19" : "#EEEDE8");
    } catch (e) {}
  })();
  </script>
</head>
<body>
  <div id="app">
    <header class="testata">
      <h1 id="page-title" class="display testata__titolo">Macroapp</h1>
      <div class="testata__azioni" id="topbar-actions"></div>
    </header>

    <main id="view" class="vista" aria-live="polite"></main>

    <nav id="nav" class="schede" aria-label="Moduli"></nav>
  </div>

  <div id="foglio" class="foglio" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
