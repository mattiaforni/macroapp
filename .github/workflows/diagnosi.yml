# Diagnosi delle functions, da lanciare a mano (Actions → Diagnosi → Run workflow) o da una
# sessione di Claude. Le sessioni non leggono i log delle esecuzioni né quelli di Google Cloud:
# qui le risposte della funzione, i permessi di invocazione e gli ultimi errori finiscono
# nelle annotazioni del job, che invece si leggono.
name: Diagnosi

on:
  workflow_dispatch:
    inputs:
      funzione:
        description: "Nome della function (come nel codice)"
        default: analyzeEntry
      ore:
        description: "Errori delle ultime N ore"
        default: "3"
      provaai:
        description: "Prova una chiamata minima all'API di Anthropic con la chiave salvata (tempo e risposta)"
        type: boolean
        default: false
      nota:
        description: "Testo per la prova dell'agente"
        default: "Chiama Domenico domani. Comprare il caffè."
      istruzioni:
        description: "Istruzioni di un progetto per la prova dell'agente (vuoto = nota senza progetto)"
        default: ""
      provatrascrizione:
        description: "Prova la trascrizione con Gemini (chiave salvata) su un audio sintetico di 13 s"
        type: boolean
        default: false
      ripara:
        description: "Rendi la funzione chiamabile dall'app (invocatore pubblico; l'accesso lo controlla Firebase Auth nel codice)"
        type: boolean
        default: false
      note:
        description: "Note dei progetti condivisi: conteggi per progetto, autore e visibilità, indici (niente testi né nomi)"
        type: boolean
        default: false
      allinea:
        description: "Con «note»: porta le note (e le foto) alla visibilità del loro progetto, sul server"
        type: boolean
        default: false
      backup:
        description: "Backup: data dell'ultimo backup riuscito, backup nel bucket, conservazione, ultime operazioni"
        type: boolean
        default: false
      backupora:
        description: "Con «backup»: fai un backup adesso (lancia la funzione backupSettimanale) e aspettane la fine"
        type: boolean
        default: false

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Le funzioni chiamate dall'app (onCall) devono essere invocabili da chiunque a livello di
      # Cloud Run: chi è davvero autorizzato lo decide il codice (req.auth, proprietario della nota).
      # Senza, il browser riceve 403 già al preflight CORS e l'app vede solo «internal».
      - name: Riparazione
        if: ${{ inputs.ripara }}
        env:
          F: ${{ inputs.funzione }}
        run: |
          P=macroapp-b9bd0
          R=europe-west1
          S=$(echo "$F" | tr '[:upper:]' '[:lower:]')
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 8000 | awk '{printf "%s%%0A", $0}')"; }
          if gcloud run services add-iam-policy-binding "$S" --region "$R" --project "$P" \
              --member=allUsers --role=roles/run.invoker > out.txt 2>&1; then
            echo "allUsers ha roles/run.invoker su $S" | ann notice "Riparazione riuscita"
          else
            ann warning "Invocatore pubblico non impostato" < out.txt
            # Ripiego (es. criterio dell'organizzazione che vieta allUsers): niente controllo IAM all'ingresso.
            if gcloud run services update "$S" --region "$R" --project "$P" --no-invoker-iam-check > out2.txt 2>&1; then
              echo "Controllo IAM all'ingresso disattivato su $S" | ann notice "Riparazione riuscita (ripiego)"
            else
              ann error "Riparazione non riuscita" < out2.txt
            fi
          fi

      # Chiamata minima con la chiave in Secret Manager: dice se l'API risponde, in quanto tempo,
      # e con quale errore (credito, workspace, modello). La chiave non viene mai stampata.
      - name: Prova dell'API di Anthropic
        if: ${{ inputs.provaai }}
        env:
          NOTA: ${{ inputs.nota }}
          ISTRUZIONI: ${{ inputs.istruzioni }}
        run: |
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 4000 | awk '{printf "%s%%0A", $0}')"; }
          if ! K=$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project macroapp-b9bd0 2>err.txt); then
            ann warning "Chiave non leggibile da qui" < err.txt; exit 0
          fi
          echo "::add-mask::$K"
          MODELLO=$(grep -oP 'sonnet: "\K[^"]+' functions/src/ai/claude.js 2>/dev/null || echo claude-sonnet-5-5)
          curl -s -o risposta.json -w "HTTP %{http_code} in %{time_total} s\n" --max-time 110 https://api.anthropic.com/v1/messages \
            -H "x-api-key: $K" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d "{\"model\":\"$MODELLO\",\"max_tokens\":200,\"messages\":[{\"role\":\"user\",\"content\":\"Rispondi solo: ok\"}],\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"r\":{\"type\":\"string\"}},\"required\":[\"r\"],\"additionalProperties\":false}}}}" > tempo.txt 2>&1 || true
          { echo "modello: $MODELLO"; echo "lunghezza chiave: ${#K}, inizio: ${K:0:10}…"; cat tempo.txt; head -c 600 risposta.json; } | ann notice "Prova dell'API"
          # Poi l'agente vero: stesso prompt e stesso schema della funzione.
          (cd functions && npm ci --silent > /dev/null 2>&1 && ANTHROPIC_API_KEY="$K" ISTRUZIONI="$ISTRUZIONI" node strumenti/prova-agente.mjs "$NOTA") 2>&1 | ann notice "Prova dell'agente"

      # Audio di prova nel repository (functions/strumenti/campioni/lezione-sintetica.webm: voce sintetica espeak-ng,
      # webm/opus a 32 kbit/s come quello del telefono): «Lezione di oggi con Marco. Abbiamo lavorato sul rovescio a
      # due mani e sullo split step prima della risposta al servizio. Il dritto in top spin va meglio, ma devo chiudere
      # prima la spalla.» Verifica chiave, modello, tempi e token; la qualità su una voce vera si giudica dal telefono.
      # (Installare espeak-ng sul runner si bloccava: il campione è generato una volta e tenuto nel repository.)
      - name: Prova della trascrizione
        if: ${{ inputs.provatrascrizione }}
        timeout-minutes: 6
        run: |
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 4000 | awk '{printf "%s%%0A", $0}')"; }
          if ! K=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project macroapp-b9bd0 2>err.txt); then
            ann warning "Chiave Gemini non leggibile da qui" < err.txt; exit 0
          fi
          echo "::add-mask::$K"
          A=strumenti/campioni/lezione-sintetica.webm
          (cd functions && npm ci --silent > /dev/null 2>&1 && GEMINI_API_KEY="$K" PROGETTO="Tennis" TEMI="Dritto,Rovescio a due mani,Servizio,Spostamenti" PERSONE="Marco" \
            node strumenti/prova-trascrizione.mjs $A audio/webm) 2>&1 | ann notice "Prova della trascrizione"
          # Senza contesto, per vedere quanto pesa il vocabolario del progetto.
          (cd functions && GEMINI_API_KEY="$K" node strumenti/prova-trascrizione.mjs $A audio/webm) 2>&1 | ann notice "Trascrizione senza contesto"

      # Note dei progetti condivisi (7/11): chi ha scritto cosa e con quale visibilità, e gli indici delle note.
      - name: Note condivise
        if: ${{ inputs.note }}
        env:
          ALLINEA: ${{ inputs.allinea && '1' || '' }}
        run: |
          ann() { echo "::notice title=$1::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }
          (cd functions && npm ci --silent > /dev/null 2>&1 && ALLINEA="$ALLINEA" node strumenti/diagnosi-note.mjs) 2>&1 | ann "Note condivise"
          gcloud firestore indexes composite list --project macroapp-b9bd0 --format=json 2>&1 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const i of JSON.parse(s)){if(!/journal_entries/.test(i.name))continue;console.log(i.state, i.fields.map(f=>f.fieldPath+(f.order==="DESCENDING"?"↓":"")).join(" + "))}}catch(e){console.log(s.slice(0,2000))}})' \
            | ann "Indici composti di journal_entries"

      # Backup settimanale (14/11): l'ultimo riuscito è la cartella più recente con il file .overall_export_metadata, che
      # Firestore scrive solo a export concluso. Oltre 8 giorni (o nessuno) è un errore.
      - name: Backup
        if: ${{ inputs.backup || inputs.backupora }}
        env:
          ORA: ${{ inputs.backupora && '1' || '' }}
        run: |
          P=macroapp-b9bd0
          B="$P-backup"
          R=europe-west1
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }
          if [ -n "$ORA" ]; then
            J=$(gcloud scheduler jobs list --location "$R" --project "$P" --format='value(name)' 2>/dev/null | grep -i backupsettimanale | head -1)
            if [ -z "$J" ]; then
              echo "Lavoro di Cloud Scheduler della funzione backupSettimanale non trovato (deploy non ancora fatto?)" | ann error "Backup adesso"
            else
              PRIMA=$(gcloud storage ls "gs://$B/*/*.overall_export_metadata" 2>/dev/null | sort | tail -1)
              gcloud scheduler jobs run "$J" --location "$R" --project "$P" --quiet
              # La funzione aspetta l'export fino a 7 minuti; qui si guarda il bucket fino a 9.
              for i in $(seq 1 36); do
                sleep 15
                DOPO=$(gcloud storage ls "gs://$B/*/*.overall_export_metadata" 2>/dev/null | sort | tail -1)
                [ -n "$DOPO" ] && [ "$DOPO" != "$PRIMA" ] && break
              done
              if [ -n "$DOPO" ] && [ "$DOPO" != "$PRIMA" ]; then echo "Backup nuovo: $DOPO" | ann notice "Backup adesso"
              else echo "Nessun backup nuovo dopo 9 minuti: vedi gli errori di backupSettimanale qui sotto (funzione=backupSettimanale)" | ann error "Backup adesso"; fi
            fi
          fi
          gcloud storage ls -l "gs://$B/*/*.overall_export_metadata" > fatti.txt 2> err.txt || true
          gcloud firestore operations list --project "$P" --format=json > operazioni.json 2>/dev/null || echo "[]" > operazioni.json
          {
            echo "Spazio occupato: $(gcloud storage du -s "gs://$B" --readable-sizes 2>/dev/null | awk '{print $1, $2}')"
            echo "Conservazione: $(gcloud storage buckets describe "gs://$B" --format='value(lifecycle_config)' 2>/dev/null | head -c 300)"
            echo "Zona del bucket: $(gcloud storage buckets describe "gs://$B" --format='value(location)' 2>/dev/null); database: $(gcloud firestore databases describe --database='(default)' --project "$P" --format='value(locationId)' 2>/dev/null), ripristino a un momento passato: $(gcloud firestore databases describe --database='(default)' --project "$P" --format='value(pointInTimeRecoveryEnablement)' 2>/dev/null)"
            [ -s err.txt ] && grep -v "matched no objects" err.txt | head -c 400
          } > altro.txt
          python3 - "$B" > backup.txt <<'PY'
          import json, re, sys, datetime as dt
          from zoneinfo import ZoneInfo
          b = sys.argv[1]
          righe = [r.split() for r in open("fatti.txt") if r.strip()[:1].isdigit() and "gs://" in r]
          tutti = sorted(((r[2].split("/")[3], r[1]) for r in righe if len(r) >= 3), key=lambda x: x[1])
          # I backup settimanali (lunedì notte) hanno il nome AAAA-MM-GG-HHMM; le altre copie (prima-del-ripristino-…, momento-…)
          # le fa il flusso Ripristino.
          fatti = [f for f in tutti if re.fullmatch(r"\d{4}-\d{2}-\d{2}-\d{4}", f[0])]
          altre = [c for c, _ in tutti if (c, _) not in fatti]
          if fatti:
              cartella, quando = fatti[-1]
              t = dt.datetime.fromisoformat(quando.replace("Z", "+00:00"))
              giorni = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 86400
              print("OK" if giorni <= 8 else "VECCHIO")
              print(f"Ultimo backup riuscito: {cartella}, finito il {t.astimezone(ZoneInfo('Europe/Rome')):%d/%m/%Y alle %H:%M} ({giorni:.1f} giorni fa)")
              print(f"Backup riusciti nel bucket gs://{b}: {len(fatti)} ({', '.join(c for c, _ in fatti)})")
          else:
              print("NESSUNO")
              print(f"Nessun backup riuscito in gs://{b}")
          if altre:
              print(f"Altre copie (dal flusso Ripristino): {', '.join(altre)}")
          print(open("altro.txt").read().rstrip())
          print()
          print("Ultime operazioni di export e import:")
          try:
              ops = json.load(open("operazioni.json"))
          except Exception:
              ops = []
          ops = [o for o in ops if any(k in o.get("metadata", {}).get("@type", "") for k in ("Export", "Import"))]
          ops.sort(key=lambda o: o.get("metadata", {}).get("startTime", ""), reverse=True)
          for o in ops[:6]:
              m = o.get("metadata", {})
              tipo = "export" if "Export" in m.get("@type", "") else "import"
              dove = m.get("outputUriPrefix") or m.get("inputUriPrefix") or ""
              doc = m.get("progressDocuments", {}).get("completedWork", "?")
              err = (o.get("error") or {}).get("message", "")
              print(f"  {tipo} {m.get('startTime', '')[:16]} {m.get('operationState', '?')} {dove} documenti {doc} {err}".rstrip())
          if not ops:
              print("  nessuna (Firestore le tiene per qualche settimana)")
          PY
          ESITO=$(head -1 backup.txt)
          tail -n +2 backup.txt > testo.txt
          if [ "$ESITO" = OK ]; then ann notice "Backup" < testo.txt; else ann error "Backup: nessun backup recente" < testo.txt; fi

      - name: Raccolta
        env:
          F: ${{ inputs.funzione }}
          ORE: ${{ inputs.ore }}
        run: |
          P=macroapp-b9bd0
          R=europe-west1
          S=$(echo "$F" | tr '[:upper:]' '[:lower:]')
          URL="https://$R-$P.cloudfunctions.net/$F"
          ann() { echo "::notice title=$1::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }

          # 1. Come risponde la funzione a un browser senza accesso (deve dire «Accesso richiesto» in JSON).
          {
            echo "--- OPTIONS (preflight CORS)"
            curl -s -o /dev/null -D - -X OPTIONS "$URL" -H "Origin: https://$P.web.app" \
              -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization" | grep -iE "^HTTP|access-control" || true
            echo "--- POST senza accesso"
            curl -s -D - -X POST "$URL" -H "Origin: https://$P.web.app" -H "content-type: application/json" -d '{"data":{}}' | head -c 600 || true
          } 2>&1 | ann "Risposta di $F"

          # 2. Chi può invocare il servizio Cloud Run (serve allUsers per le funzioni chiamate dall'app).
          gcloud run services get-iam-policy "$S" --region "$R" --project "$P" --format=yaml 2>&1 | ann "Invocatori di $S"

          # 3. Ultimi errori e avvisi della funzione.
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$S\" AND severity>=WARNING" \
            --project "$P" --freshness "${ORE}h" --limit 25 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message,httpRequest.status)' 2>&1 | ann "Errori di $S (ultime $ORE ore)"

          # 4. Registro completo (anche i tempi delle fasi scritti con console.log).
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$S\" AND textPayload:*" \
            --project "$P" --freshness "${ORE}h" --limit 30 \
            --format='value(timestamp,severity,textPayload)' 2>&1 | ann "Registro di $S"

          # 5. Ultime richieste HTTP (stato e latenza).
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$S\" AND httpRequest.status>0" \
            --project "$P" --freshness "${ORE}h" --limit 15 \
            --format='value(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency)' 2>&1 | ann "Richieste a $S"
