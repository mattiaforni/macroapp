# Deploy su Firebase a ogni push su main (hosting, regole e indici Firestore, functions), dopo le prove
# (prove.yml: functions, regole di Firestore sull'emulatore, flusso dell'app in Chromium). Se le prove non passano
# non si pubblica niente, e le schermate restano come artifact dell'esecuzione.
# Si può anche lanciare a mano: Actions → Deploy Firebase → Run workflow
# (serve per esempio dopo aver aggiornato un segreto in Secret Manager). Solo per le emergenze, la spunta
# «Emergenza: pubblica senza prove» salta le prove.
#
# Richiede il secret di repository FIREBASE_SERVICE_ACCOUNT: il JSON della chiave
# dell'account di servizio github-deploy (vedi README → Deploy automatico).
name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      senza_prove:
        description: "Emergenza: pubblica senza prove"
        type: boolean
        default: false

# Un'esecuzione alla volta, prove comprese: così un commit vecchio non si pubblica mai dopo uno nuovo. Se ne arrivano
# altre mentre una gira, resta in coda solo l'ultima (che contiene anche le precedenti).
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  prove:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.senza_prove) }}
    uses: ./.github/workflows/prove.yml

  deploy:
    needs: prove
    # Con le prove passate; senza prove solo con la spunta dell'emergenza (allora «prove» risulta saltato).
    if: ${{ !cancelled() && (needs.prove.result == 'success' || (needs.prove.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.senza_prove)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Pubblicazione senza prove
        if: ${{ needs.prove.result == 'skipped' }}
        run: echo "::warning title=Emergenza::Pubblicazione senza prove, chiesta a mano"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dipendenze functions
        run: cd functions && npm ci

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Account Google (Contatti, Calendario, Drive). Le tre API vanno attive nel progetto (ripeterlo è
      # innocuo). Le functions scambiano e rinnovano il permesso con lo stesso client OAuth web dell'accesso con Google:
      # ID e secret si leggono dalla configurazione di Firebase Authentication e si tengono nel
      # segreto GOOGLE_OAUTH_CLIENT, aggiornato solo se cambiano. Se non si leggono, il segreto
      # resta com'è (o nasce vuoto, così il deploy passa) e la funzione dice che manca.
      - name: Google (API e client OAuth)
        run: |
          P=macroapp-b9bd0
          S=GOOGLE_OAUTH_CLIENT
          gcloud services enable people.googleapis.com calendar-json.googleapis.com drive.googleapis.com --project "$P" --quiet \
            || echo "::warning title=Google::API di Contatti, Calendario o Drive non attivate dal deploy: vanno attivate dalla console"
          VAL=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$P/defaultSupportedIdpConfigs/google.com" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"id": d["clientId"], "secret": d["clientSecret"]}) if d.get("clientId") and d.get("clientSecret") else "")' 2>/dev/null || true)
          if [ -n "$VAL" ]; then
            echo "::add-mask::$(printf '%s' "$VAL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["secret"])')"
          fi
          ATTUALE=$(gcloud secrets versions access latest --secret="$S" --project "$P" 2>/dev/null || true)
          if [ -z "$VAL" ]; then
            echo "::warning title=Google::ID e secret del client OAuth non leggibili da Firebase Authentication: $S resta com'è"
            [ -n "$ATTUALE" ] && exit 0
            VAL='{}'
          fi
          gcloud secrets describe "$S" --project "$P" > /dev/null 2>&1 \
            || gcloud secrets create "$S" --project "$P" --replication-policy=automatic --quiet > /dev/null
          if [ "$ATTUALE" != "$VAL" ]; then
            printf '%s' "$VAL" | gcloud secrets versions add "$S" --project "$P" --data-file=- --quiet > /dev/null
            echo "$S aggiornato"
          fi

      # Notifiche push: Firebase Cloud Messaging (invio dalle functions) e registrazione dei telefoni
      # (getToken nell'app). Di solito sono già attive nei progetti Firebase; ripeterlo è innocuo.
      - name: Notifiche (API di Cloud Messaging)
        run: |
          gcloud services enable fcm.googleapis.com fcmregistrations.googleapis.com --project macroapp-b9bd0 --quiet \
            || echo "::warning title=Notifiche::API di Cloud Messaging non attivate dal deploy: vanno attivate dalla console"

      # Backup settimanale (14/11, funzione backupSettimanale): il bucket <progetto>-backup nello stesso progetto e nella
      # zona del database, senza accesso pubblico, con la regola che cancella i backup dopo 8 settimane (56 giorni);
      # il permesso di esportare (roles/datastore.importExportAdmin) al service account delle functions e a quello del
      # deploy (serve al flusso Ripristino), e la scrittura nel bucket a loro e all'agente di servizio di Firestore.
      # Ripeterlo è innocuo. Se un permesso non si può dare da qui, un avviso dice cosa fare dalla console; il deploy va
      # avanti (l'app non dipende dal backup). Ripristino: docs/ARCHITETTURA.md, Backup.
      - name: Backup (bucket, permessi, conservazione)
        run: |
          P=macroapp-b9bd0
          B="$P-backup"
          avviso() { echo "::warning title=Backup::$1"; }
          N=$(gcloud projects describe "$P" --format='value(projectNumber)')
          LOC=$(gcloud firestore databases describe --database='(default)' --project "$P" --format='value(locationId)')
          case "$LOC" in eur3) BL=EU ;; nam5) BL=US ;; *) BL="$LOC" ;; esac
          if ! gcloud storage buckets describe "gs://$B" --project "$P" > /dev/null 2>&1; then
            gcloud storage buckets create "gs://$B" --project "$P" --location "$BL" --default-storage-class=STANDARD \
              --uniform-bucket-level-access --public-access-prevention --quiet \
              && echo "::notice title=Backup::Bucket $B creato in $BL (database in $LOC)" \
              || { avviso "Bucket $B non creato: crealo dalla console (Cloud Storage → Crea, zona $BL, accesso uniforme, niente accesso pubblico)"; exit 0; }
          fi
          printf '%s' '{"rule":[{"action":{"type":"Delete"},"condition":{"age":56}}]}' > conservazione.json
          gcloud storage buckets update "gs://$B" --lifecycle-file=conservazione.json --public-access-prevention --quiet > /dev/null \
            || avviso "Regola di conservazione non impostata su $B: Cloud Storage → $B → Ciclo di vita → Elimina oggetto, età 56 giorni"
          FUNZIONI="$N-compute@developer.gserviceaccount.com"
          DEPLOY=$(gcloud config get-value account 2>/dev/null)
          for SA in "$FUNZIONI" "$DEPLOY"; do
            [ -n "$SA" ] || continue
            gcloud projects add-iam-policy-binding "$P" --member="serviceAccount:$SA" --role=roles/datastore.importExportAdmin \
              --condition=None --quiet > /dev/null 2> iam.err \
              || avviso "Permesso di export non dato a $SA ($(head -c 160 iam.err | tr '\n' ' ')). Dalla console: IAM e amministrazione → IAM → Concedi l'accesso → $SA → ruolo «Amministratore importazione/esportazione Cloud Datastore»"
            gcloud storage buckets add-iam-policy-binding "gs://$B" --member="serviceAccount:$SA" --role=roles/storage.admin --quiet > /dev/null \
              || avviso "Scrittura nel bucket non data a $SA: Cloud Storage → $B → Autorizzazioni → Concedi l'accesso → ruolo «Amministratore Storage»"
          done
          # L'export lo scrive l'agente di servizio di Firestore (nello stesso progetto di solito ha già accesso: lo si dà lo
          # stesso, sul solo bucket). Se l'agente non esiste ancora, Firestore lo crea al primo export.
          gcloud storage buckets add-iam-policy-binding "gs://$B" --member="serviceAccount:service-$N@gcp-sa-firestore.iam.gserviceaccount.com" \
            --role=roles/storage.admin --quiet > /dev/null 2>&1 || echo "Agente di servizio di Firestore non ancora presente: nessun permesso sul bucket"

      - name: Numero di versione nell'app
        run: echo "export const VERSION = \"${GITHUB_SHA::7}\";" > public/js/version.js

      - name: Deploy
        # --force: niente domande interattive; le functions tolte dal codice vengono rimosse anche dal progetto.
        # Se fallisce, la coda del registro va in un'annotazione: le sessioni di Claude non leggono i log
        # delle esecuzioni, le annotazioni sì.
        run: |
          set -o pipefail
          if ! npx firebase-tools@15 deploy --only hosting,firestore,functions --non-interactive --force 2>&1 | tee deploy.log; then
            coda=$(grep -v '^\s*$' deploy.log | tail -45 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Deploy non riuscito::${coda}"
            [ -f firebase-debug.log ] && echo "::error title=firebase-debug.log::$(grep -iE 'error|denied|fail' firebase-debug.log | tail -25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # Le funzioni chiamate dall'app devono essere invocabili da chiunque a livello di Cloud Run
      # (chi è autorizzato lo decide il codice con Firebase Auth). Firebase lo imposta solo alla
      # creazione e una volta non c'era: senza, l'app vede «internal». Ripeterlo è innocuo.
      - name: Funzioni chiamate dall'app invocabili
        run: |
          for S in analyzeentry bank google avvisa prodotto trascrivi contribuisci chiedi; do
            gcloud run services add-iam-policy-binding "$S" --region europe-west1 --project macroapp-b9bd0 \
              --member=allUsers --role=roles/run.invoker --quiet > /dev/null
          done
