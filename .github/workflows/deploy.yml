# Deploy su Firebase a ogni push su main (hosting, regole e indici Firestore, functions).
# Si può anche lanciare a mano: Actions → Deploy Firebase → Run workflow
# (serve per esempio dopo aver aggiornato un segreto in Secret Manager).
#
# Richiede il secret di repository FIREBASE_SERVICE_ACCOUNT: il JSON della chiave
# dell'account di servizio github-deploy (vedi README → Deploy automatico).
name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dipendenze functions
        run: cd functions && npm ci

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Numero di versione nell'app
        run: echo "export const VERSION = \"${GITHUB_SHA::7}\";" > public/js/version.js

      - name: Deploy
        # --force: niente domande interattive; le functions tolte dal codice vengono rimosse anche dal progetto.
        # Se fallisce, la coda del registro va in un'annotazione: le sessioni di Claude non leggono i log
        # delle esecuzioni, le annotazioni sì.
        run: |
          set -o pipefail
          if ! npx firebase-tools@15 deploy --only hosting,firestore,functions --non-interactive --force 2>&1 | tee deploy.log; then
            coda=$(grep -v '^\s*$' deploy.log | tail -45 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Deploy non riuscito::${coda}"
            [ -f firebase-debug.log ] && echo "::error title=firebase-debug.log::$(grep -iE 'error|denied|fail' firebase-debug.log | tail -25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      # Le funzioni chiamate dall'app devono essere invocabili da chiunque a livello di Cloud Run
      # (chi è autorizzato lo decide il codice con Firebase Auth). Firebase lo imposta solo alla
      # creazione e una volta non c'era: senza, l'app vede «internal». Ripeterlo è innocuo.
      - name: Funzioni chiamate dall'app invocabili
        run: |
          for S in analyzeentry; do
            gcloud run services add-iam-policy-binding "$S" --region europe-west1 --project macroapp-b9bd0 \
              --member=allUsers --role=roles/run.invoker --quiet > /dev/null
          done
