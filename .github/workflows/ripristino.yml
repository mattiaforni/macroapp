# Ripristino di Firestore da un backup settimanale (14/11), da lanciare a mano: Actions → Ripristino → Run workflow.
# Procedura completa in docs/ARCHITETTURA.md, Backup.
#
# - destinazione «prova» (predefinita): il backup va in un database temporaneo dello stesso progetto, si contano i
#   documenti per collezione accanto a quelli del database vero, e il database temporaneo si elimina. Non tocca i dati:
#   serve a sapere che il backup si ripristina davvero (da fare ogni tanto, e subito dopo il primo backup).
# - destinazione «produzione»: prima un backup dello stato attuale (cartella prima-del-ripristino-…, per tornare
#   indietro), poi il ripristino sui dati veri. I documenti del backup sostituiscono quelli con lo stesso id; quelli
#   nati dopo il backup restano. Serve la parola RIPRISTINA nel campo «conferma».
# Con «collezioni» si ripristinano solo quelle (es. journal_entries,journal_photos), il resto non si tocca.
# Con «momento» invece di un backup si usa il database com'era a quell'ora (esportato lì per lì con --snapshot-time):
# nell'ultima ora sempre, negli ultimi 7 giorni solo con il ripristino a un momento passato (PITR) attivo.
name: Ripristino

on:
  workflow_dispatch:
    inputs:
      backup:
        description: "Cartella del backup (es. 2026-11-16-0317) o «ultimo»"
        default: ultimo
      momento:
        description: "Invece di un backup: com'era il database a quest'ora di Roma (es. 2026-11-15 21:00). Senza il ripristino a un momento passato, solo nell'ultima ora"
        default: ""
      destinazione:
        description: "prova = database temporaneo, poi eliminato (i dati non si toccano); produzione = sui dati veri"
        type: choice
        options: [prova, produzione]
        default: prova
      collezioni:
        description: "Solo queste collezioni, separate da virgole (vuoto = tutte quelle del backup)"
        default: ""
      conferma:
        description: "Per «produzione»: scrivi RIPRISTINA"
        default: ""

concurrency:
  group: ripristino
  cancel-in-progress: false

jobs:
  ripristino:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      P: macroapp-b9bd0
      B: macroapp-b9bd0-backup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Dipendenze functions
        run: cd functions && npm ci --silent

      - name: Scelta del backup
        env:
          SCELTO: ${{ inputs.backup }}
          MOMENTO: ${{ inputs.momento }}
          SOLO: ${{ inputs.collezioni }}
          DEST: ${{ inputs.destinazione }}
          CONFERMA: ${{ inputs.conferma }}
        run: |
          errore() { echo "::error title=Ripristino::$1"; exit 1; }
          if [ "$DEST" = produzione ] && [ "$CONFERMA" != RIPRISTINA ]; then
            errore "Per ripristinare sui dati veri scrivi RIPRISTINA nel campo «conferma». Niente è stato toccato."
          fi
          if [ -n "$MOMENTO" ]; then
            # Un momento passato: prima si esporta il database com'era allora (versioni di Firestore: un'ora, o 7 giorni
            # con il ripristino a un momento passato attivo), poi si procede come con un backup.
            T=$(TZ=Europe/Rome date -d "$MOMENTO" -u +%Y-%m-%dT%H:%M:00Z 2>/dev/null) || errore "Momento «$MOMENTO» non leggibile: scrivilo come 2026-11-15 21:00"
            SCELTO="momento-$(TZ=Europe/Rome date -d "$MOMENTO" +%Y-%m-%d-%H%M)"
            ATTUALI=$(cd functions && node strumenti/conta-ripristino.mjs --collezioni)
            gcloud firestore export "gs://$B/$SCELTO" --snapshot-time="$T" --collection-ids="$ATTUALI" --project="$P" --quiet > out.txt 2>&1 \
              || errore "Il database com'era il $MOMENTO non si legge più ($(grep -iE 'error|too old|earliest' out.txt | head -c 300 | tr '\n' ' ')). Senza il ripristino a un momento passato Firestore tiene solo l'ultima ora."
            echo "::notice title=Momento passato::Il database com'era il $MOMENTO (ora di Roma) è in gs://$B/$SCELTO"
          fi
          FATTI=$(gcloud storage ls "gs://$B/*/*.overall_export_metadata" 2>/dev/null | awk -F/ '{print $4}' | sort -u)
          [ -n "$FATTI" ] || errore "Nessun backup riuscito in gs://$B"
          if [ "$SCELTO" = ultimo ] || [ -z "$SCELTO" ]; then
            CARTELLA=$(printf '%s\n' "$FATTI" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$' | sort | tail -1)
          else
            CARTELLA="$SCELTO"
          fi
          printf '%s\n' "$FATTI" | grep -qx "$CARTELLA" || errore "Backup «$CARTELLA» non trovato o non concluso. Ci sono: $(echo $FATTI)"
          # Le collezioni del backup: una cartella kind_<collezione> per ognuna.
          NEL_BACKUP=$(gcloud storage ls "gs://$B/$CARTELLA/all_namespaces/" | sed -n 's|.*/kind_\([^/]*\)/$|\1|p' | sort | paste -sd, -)
          [ -n "$NEL_BACKUP" ] || errore "Il backup $CARTELLA non ha collezioni separate (export di tutto): si ripristina solo intero, dalla console"
          if [ -n "$SOLO" ]; then
            SOLO=$(echo "$SOLO" | tr -d ' ')
            for c in $(echo "$SOLO" | tr ',' ' '); do
              echo ",$NEL_BACKUP," | grep -q ",$c," || errore "La collezione «$c» non è nel backup $CARTELLA (c'è: $NEL_BACKUP)"
            done
            COLLEZIONI="$SOLO"
          else
            COLLEZIONI="$NEL_BACKUP"
          fi
          echo "CARTELLA=$CARTELLA" >> "$GITHUB_ENV"
          echo "COLLEZIONI=$COLLEZIONI" >> "$GITHUB_ENV"
          echo "PARZIALE=$SOLO" >> "$GITHUB_ENV"
          echo "::notice title=Backup scelto::$CARTELLA → $DEST, collezioni: $COLLEZIONI"

      # ── Prova: database temporaneo, conteggi, eliminazione ──
      - name: Prova su un database temporaneo
        if: ${{ inputs.destinazione == 'prova' }}
        run: |
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }
          DB="ripristino-${GITHUB_RUN_ID}"
          echo "DB_PROVA=$DB" >> "$GITHUB_ENV"
          LOC=$(gcloud firestore databases describe --database='(default)' --project "$P" --format='value(locationId)')
          gcloud firestore databases create --database="$DB" --location="$LOC" --project="$P" --quiet > out.txt 2>&1 \
            || { ann error "Database temporaneo non creato (serve il ruolo «Proprietario Cloud Datastore» a github-deploy)" < out.txt; exit 1; }
          T0=$(date +%s)
          gcloud firestore import "gs://$B/$CARTELLA" --database="$DB" --collection-ids="$COLLEZIONI" --project="$P" --quiet > out.txt 2>&1 \
            || { ann error "Import nel database temporaneo non riuscito" < out.txt; exit 1; }
          echo "Import di $CARTELLA in $DB: $(( $(date +%s) - T0 )) s"
          ESITO=0
          (cd functions && DB="$DB" COLLEZIONI="$COLLEZIONI" node strumenti/conta-ripristino.mjs) > conti.txt 2>&1 || ESITO=$?
          { echo "Backup $CARTELLA ripristinato nel database temporaneo $DB in $(( $(date +%s) - T0 )) s."; echo; cat conti.txt; } > riepilogo.txt
          if [ $ESITO = 0 ]; then ann notice "Ripristino di prova riuscito" < riepilogo.txt; else ann error "Ripristino di prova: qualcosa manca" < riepilogo.txt; exit 1; fi

      - name: Eliminazione del database temporaneo
        if: ${{ always() && env.DB_PROVA != '' }}
        run: |
          for i in 1 2 3; do
            gcloud firestore databases delete --database="$DB_PROVA" --project="$P" --quiet > out.txt 2>&1 && { echo "Database $DB_PROVA eliminato"; exit 0; }
            sleep 20
          done
          echo "::warning title=Ripristino::Database temporaneo $DB_PROVA non eliminato ($(head -c 200 out.txt | tr '\n' ' ')): eliminalo dalla console (Firestore → $DB_PROVA → Elimina)"

      # ── Produzione: prima un backup dello stato attuale, poi il ripristino ──
      - name: Backup dello stato attuale
        if: ${{ inputs.destinazione == 'produzione' }}
        run: |
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }
          PRIMA="prima-del-ripristino-$(TZ=Europe/Rome date +%Y-%m-%d-%H%M)"
          ATTUALI=$(cd functions && node strumenti/conta-ripristino.mjs --collezioni)
          gcloud firestore export "gs://$B/$PRIMA" --collection-ids="$ATTUALI" --project="$P" --quiet > out.txt 2>&1 \
            || { ann error "Backup dello stato attuale non riuscito: il ripristino non parte" < out.txt; exit 1; }
          echo "PRIMA=$PRIMA" >> "$GITHUB_ENV"
          echo "::notice title=Stato attuale salvato::gs://$B/$PRIMA (per tornare indietro: Ripristino con backup = $PRIMA)"

      - name: Ripristino sui dati veri
        if: ${{ inputs.destinazione == 'produzione' }}
        run: |
          ann() { echo "::$1 title=$2::$(sed -e 's/%/%25/g' -e 's/\r//g' | head -c 12000 | awk '{printf "%s%%0A", $0}')"; }
          gcloud firestore import "gs://$B/$CARTELLA" --collection-ids="$COLLEZIONI" --project="$P" --quiet > out.txt 2>&1 \
            || { ann error "Ripristino non riuscito (lo stato di prima è in $PRIMA)" < out.txt; exit 1; }
          (cd functions && DB="(default)" COLLEZIONI="$COLLEZIONI" node strumenti/conta-ripristino.mjs) > conti.txt 2>&1 || true
          { echo "Ripristinato $CARTELLA sui dati veri (collezioni: $COLLEZIONI)."
            echo "I documenti del backup hanno sostituito quelli con lo stesso id; quelli nati dopo il backup sono rimasti."
            echo "Per tornare a prima: Ripristino con backup = $PRIMA, destinazione produzione."; echo; cat conti.txt; } | ann notice "Ripristino fatto"
